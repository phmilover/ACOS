# Одна из программ невыполнима: у стадии воска нет постов, а программа Wax
# состоит только из неё. Остальные программы обслуживаются нормально.
# Ожидается: мойка работает весь день, машины Wax копятся в очереди воска
# (лишние получают отказ); после закрытия въезда, когда уедут все остальные,
# фиксируется тупик (код 2).

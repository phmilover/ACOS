# Обычный рабочий день городской автомойки (совпадает со встроенной конфигурацией).
#
# stage   = <имя> <число постов> <мин. время> <макс. время> <вместимость накопителя перед стадией>
stage   = prewash 1 3 5 3
stage   = tunnel  2 6 9 2
stage   = wax     1 4 6 2
stage   = dry     2 3 5 3

# program = <имя> <вес выбора> <приоритет> <стадии маршрута в порядке линии>
program = Express  40 1 tunnel dry
program = Standard 40 2 prewash tunnel dry
program = Premium  20 3 prewash tunnel wax dry

cars     = 40           # сколько машин приедет (0 - без ограничения)
arrival  = 2 6          # интервал между машинами, мин
day      = 240          # сколько минут открыт въезд (0 - без ограничения)
failure  = 0.05 5 15    # вероятность поломки поста после операции, ремонт мин..макс
priority = fifo         # fifo | program | shortest

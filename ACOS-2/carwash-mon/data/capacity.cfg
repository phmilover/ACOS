# Сушка: один пост на две машины (ёмкость поста 2).
# Шестое поле stage - ёмкость поста, по умолчанию 1.
#
# stage   = <имя> <постов> <мин> <макс> <очередь> [ёмкость поста]
stage   = prewash 1 3 5 3
stage   = tunnel  2 6 9 2
stage   = wax     1 4 6 2
stage   = dry     1 3 5 2 2   # один пост сушки на 2 машины

# program = <имя> <вес выбора> <приоритет> <стадии маршрута в порядке линии>
program = Express  40 1 tunnel dry
program = Standard 40 2 prewash tunnel dry
program = Premium  20 3 prewash tunnel wax dry

cars     = 30           # сколько машин приедет за день (0 - без ограничения)
arrival  = 2 6          # интервал между машинами, мин
day      = 240          # продолжительность работы въезда, мин (0 - без ограничения)
failure  = 0.01 5 15    # вероятность поломки поста за минуту, ремонт мин..макс
priority = fifo         # fifo | program | shortest
